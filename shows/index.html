<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Shows & Games</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--muted:#8d96a7;--text:#f5f7fb;--line:#2a303b;--tv:#7c9cff;--nfl:#58c48d;--good:#63d297;--bad:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:28px}.sub,.small,.meta,.sync{color:var(--muted);font-size:13px}.search{position:relative;flex:1;max-width:480px;min-width:280px}.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px;border-radius:12px;font-size:16px}.results{position:absolute;z-index:20;top:50px;left:0;right:0;background:#1b1f27;border:1px solid var(--line);border-radius:12px;overflow:hidden}.result{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result img{width:44px;height:62px;object-fit:cover;border-radius:6px}.nextgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.nextcard,.card,.game,.agendaItem,.suggestCard{background:var(--card);border:1px solid var(--line);border-radius:14px}.nextcard{padding:14px}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.big{font-size:20px;font-weight:700;margin-top:5px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav button,.btn{background:#232833;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px 11px;cursor:pointer}.nav button.active{background:var(--text);color:#111}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}.grid,.suggestGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card,.suggestCard{overflow:hidden}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20242c}.body{padding:13px}.title{font-size:18px;font-weight:700}.row{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}.row input,.row select{background:#11141a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px}.row input{width:58px}.danger{margin-left:auto;color:var(--bad)}.liked{color:var(--good)}.disliked{color:var(--bad)}.notinterested{color:#c7ccd6}.watched{opacity:.55;text-decoration:line-through}.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}.calhead h2{font-size:20px;margin:0}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:var(--muted);font-size:11px}.day{min-height:115px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px}.date{font-size:12px;color:var(--muted);font-weight:600}.event{font-size:11px;padding:5px 6px;border-radius:6px;margin-top:5px}.event.tv{background:rgba(124,156,255,.15);border-left:3px solid var(--tv)}.event.nfl{background:rgba(88,196,141,.15);border-left:3px solid var(--nfl)}.event button{font-size:10px;padding:3px 6px;margin-top:4px}.agenda{display:none}.agendaItem{padding:13px;margin-bottom:9px;display:flex;gap:12px}.agendaDate{width:72px;flex:0 0 72px;text-align:center}.agendaDate b{display:block;font-size:18px}.agendaDate span{display:block;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.tv{background:var(--tv)}.dot.nfl{background:var(--nfl)}.games{display:grid;gap:9px}.game{padding:13px;display:flex;justify-content:space-between;gap:12px}.right{text-align:right;color:var(--muted);font-size:13px}.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}.hide{display:none}.reason{font-size:12px;color:#aeb8ff;margin-top:7px}.suggestHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.suggestHead h2{margin:0;font-size:20px}
@media(max-width:700px){.wrap{padding:14px}.search{min-width:100%}.nextgrid{grid-template-columns:1fr}.week,.calendar{display:none}.agenda{display:block}.calhead{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}.game{display:block}.right{text-align:left;margin-top:5px}.row .btn{flex:1}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>My Shows & Games</h1><div class="sub">TV progress, recent episodes, recommendations, and NFL games.</div></div><div class="search"><input id="search" placeholder="Search for a TV show..." autocomplete="off"><div id="results" class="results" hidden></div></div></div>
<div id="nextgrid" class="nextgrid"></div>
<div class="nav" id="mainNav"><button class="active" data-page="shows">Shows</button><button data-page="suggestions">Suggestions</button><button data-page="calendar">Calendar</button><button data-page="football">Football</button></div>
<section id="showsPage"><div id="stats" class="stats"></div><div class="nav" id="showTabs"><button class="active" data-filter="Watching">Watching</button><button data-filter="Want to Watch">Want to Watch</button><button data-filter="Finished">Finished</button><button data-filter="All">All</button></div><div id="grid" class="grid"></div></section>
<section id="suggestionsPage" class="hide"><div class="suggestHead"><div><h2>Suggestions for You</h2><div class="small">Based on your library and feedback.</div></div><button class="btn" id="refreshSuggestions">Refresh</button></div><div id="suggestions" class="suggestGrid"></div></section>
<section id="calendarPage" class="hide"><div class="calhead"><button id="prevMonth">‹ Previous</button><h2 id="monthTitle"></h2><button id="nextMonth">Next ›</button></div><div id="syncStatus" class="sync"></div><div class="week"><div class="weekday">SUN</div><div class="weekday">MON</div><div class="weekday">TUE</div><div class="weekday">WED</div><div class="weekday">THU</div><div class="weekday">FRI</div><div class="weekday">SAT</div></div><div id="calendar" class="calendar"></div><div id="agenda" class="agenda"></div></section>
<section id="footballPage" class="hide"><div class="small" style="margin-bottom:12px">All NFC East games plus Thursday Night, Sunday Night, and Monday Night Football.</div><div id="games" class="games"></div></section>
</div><script>
const KEY='my-shows-v2',OLDKEY='my-shows-v1',FBKEY='my-shows-feedback-v1',SHOWNKEY='my-shows-suggestions-shown-v1',PAGEKEY='my-shows-suggestions-page-v1',WATCHKEY='my-shows-watched-v1';
let shows=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLDKEY)||'[]'),feedback=JSON.parse(localStorage.getItem(FBKEY)||'{}'),watched=JSON.parse(localStorage.getItem(WATCHKEY)||'{}'),shownSuggestions=new Set(JSON.parse(localStorage.getItem(SHOWNKEY)||'[]')),suggestionPage=Number(localStorage.getItem(PAGEKEY)||0),currentFilter='Watching',calDate=new Date(),suggestions=[],nflGames=[];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(shows));renderAll()}function saveFeedback(){localStorage.setItem(FBKEY,JSON.stringify(feedback))}function imageFor(s){return s.image?.original||s.image?.medium||''}function fmt(v){return new Date(v).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function episodeDate(e){const day=e.airdate||e.date;if(!day)return null;const t=e.airtime&&/^\d\d:\d\d$/.test(e.airtime)?e.airtime:'20:00';return new Date(`${day}T${t}:00`)}function epKey(showId,e){return `${showId}:${e.id||`${e.season}-${e.number}-${e.date||e.airdate||''}`}`}function toggleWatched(k){watched[k]=!watched[k];localStorage.setItem(WATCHKEY,JSON.stringify(watched));renderAll()}
async function enrich(show){try{const [sr,er]=await Promise.all([fetch(`https://api.tvmaze.com/shows/${show.id}?embed=nextepisode`),fetch(`https://api.tvmaze.com/shows/${show.id}/episodes?specials=1`)]),sd=sr.ok?await sr.json():{},eps=er.ok?await er.json():[],now=new Date(),cutoff=new Date(now);cutoff.setDate(cutoff.getDate()-28);cutoff.setHours(0,0,0,0);const mapped=e=>({id:e.id,name:e.name,season:e.season,number:e.number,date:e.airdate,airtime:e.airtime||'20:00'}),recent=eps.filter(e=>{const d=episodeDate(e);return d&&d>=cutoff&&d<now}).map(mapped),future=eps.filter(e=>{const d=episodeDate(e);return d&&d>=now}).map(mapped),embedded=sd._embedded?.nextepisode,n=future[0]||embedded||show.next;return {...show,genres:sd.genres||show.genres||[],rating:sd.rating?.average||show.rating||null,next:n?{id:n.id,name:n.name,season:n.season,number:n.number,date:n.date||n.airdate,airtime:n.airtime||'20:00'}:null,recentEpisodes:recent,futureEpisodes:future,lastSynced:new Date().toISOString()}}catch{return {...show,recentEpisodes:show.recentEpisodes||[],futureEpisodes:show.futureEpisodes||[]}}}
async function addShow(raw,status='Watching'){if(shows.some(s=>s.id===raw.id))return;shows.unshift(await enrich({id:raw.id,name:raw.name,image:raw.image,network:raw.network?.name||raw.webChannel?.name||'',genres:raw.genres||[],rating:raw.rating?.average||null,status,season:1,episode:0,next:null,recentEpisodes:[],futureEpisodes:[]}));save();$('#results').hidden=true;$('#search').value=''}function updateShow(id,f,v){const s=shows.find(x=>x.id===id);if(!s)return;s[f]=(f==='season'||f==='episode')?Math.max(0,Number(v)||0):v;save()}function removeShow(id){shows=shows.filter(s=>s.id!==id);save()}async function refreshOne(id){const i=shows.findIndex(s=>s.id===id);if(i>=0){shows[i]=await enrich(shows[i]);save()}}async function refreshAll(){const list=shows.map((s,i)=>({s,i})).filter(x=>x.s.status==='Watching'||x.s.status==='Finished');if($('#syncStatus'))$('#syncStatus').textContent='Updating episode history…';for(const x of list)shows[x.i]=await enrich(shows[x.i]);localStorage.setItem(KEY,JSON.stringify(shows));if($('#syncStatus'))$('#syncStatus').textContent='Showing aired episodes from the last 28 days plus upcoming episodes.';renderAll()}
function renderShows(){const visible=currentFilter==='All'?shows:shows.filter(s=>s.status===currentFilter);$('#stats').innerHTML=`<div class="pill"><b>${shows.filter(s=>s.status==='Watching').length}</b> watching</div><div class="pill"><b>${shows.filter(s=>s.status==='Want to Watch').length}</b> queued</div><div class="pill"><b>${shows.filter(s=>s.status==='Finished').length}</b> finished</div>`;$('#grid').innerHTML=visible.length?visible.map(s=>`<div class="card">${imageFor(s)?`<img class="poster" src="${esc(imageFor(s))}">`:''}<div class="body"><div class="title">${esc(s.name)}</div><div class="meta">${esc(s.network||'Network not listed')} · ${esc(s.status)}</div><div class="small">${s.next?`Next: S${s.next.season}E${s.next.number} ${esc(s.next.name)} · ${esc(s.next.date)}`:'No upcoming episode listed'}</div><div class="row"><span>S</span><input type="number" value="${s.season}" onchange="updateShow(${s.id},'season',this.value)"><span>E</span><input type="number" value="${s.episode}" onchange="updateShow(${s.id},'episode',this.value)"></div><div class="row"><select onchange="updateShow(${s.id},'status',this.value)">${['Watching','Want to Watch','Finished'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="refreshOne(${s.id})">Refresh</button><button class="btn danger" onclick="removeShow(${s.id})">Remove</button></div></div></div>`).join(''):'<div class="empty">No shows here yet.</div>'}
function tvEvents(){const out=[],seen=new Set();shows.filter(s=>s.status==='Watching').forEach(s=>[...(s.recentEpisodes||[]),...(s.futureEpisodes||[])].forEach(e=>{const d=episodeDate(e),k=epKey(s.id,e);if(!d||seen.has(k))return;seen.add(k);out.push({type:'tv',date:d,title:`${s.name} S${e.season}E${e.number}`,detail:e.name||'',watchKey:k,watched:!!watched[k]})}));return out}
function allEvents(){return [...tvEvents(),...nflGames].sort((a,b)=>a.date-b.date)}function renderNext(){const ev=allEvents().filter(e=>e.date>new Date()),tv=ev.find(e=>e.type==='tv'),nfl=ev.find(e=>e.type==='nfl');$('#nextgrid').innerHTML=`<div class="nextcard"><div class="label">Next Episode</div><div class="big">${tv?esc(tv.title):'Nothing scheduled'}</div><div class="small">${tv?fmt(tv.date):'No announced episode date.'}</div></div><div class="nextcard"><div class="label">Next Football Game</div><div class="big">${nfl?esc(nfl.title):'Loading schedule…'}</div><div class="small">${nfl?fmt(nfl.date):''}</div></div>`}
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();$('#monthTitle').textContent=calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});const ev=allEvents().filter(e=>e.date.getFullYear()===y&&e.date.getMonth()===m),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const dayEv=ev.filter(e=>e.date.toDateString()===d.toDateString());html+=`<div class="day" style="${d.getMonth()!==m?'opacity:.35':''}"><div class="date">${d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}</div>${dayEv.map(e=>e.type==='tv'?`<div class="event tv ${e.watched?'watched':''}">${esc(e.title)}<br><button onclick="event.stopPropagation();toggleWatched('${e.watchKey}')">${e.watched?'✓ Watched':'Mark watched'}</button></div>`:`<div class="event nfl">${esc(e.title)}<div class="small">${esc(e.detail||'')}</div></div>`).join('')}</div>`}$('#calendar').innerHTML=html;const days=[...new Set(ev.map(e=>e.date.toDateString()))].map(s=>new Date(s)).sort((a,b)=>a-b);$('#agenda').innerHTML=days.length?days.map(d=>`<div class="agendaItem"><div class="agendaDate"><b>${d.toLocaleDateString(undefined,{weekday:'short'})}</b><span>${d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div><div style="flex:1">${ev.filter(e=>e.date.toDateString()===d.toDateString()).map(e=>`<div style="margin-bottom:12px" class="${e.watched?'watched':''}"><b><span class="dot ${e.type}"></span>${esc(e.title)}</b><div class="small">${esc(e.detail||'')} · ${e.date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</div>${e.type==='tv'?`<button class="btn" style="margin-top:6px" onclick="toggleWatched('${e.watchKey}')">${e.watched?'✓ Watched — undo':'Mark watched'}</button>`:''}</div>`).join('')}</div></div>`).join(''):'<div class="empty">Nothing for this month.</div>'}
async function loadNFL(){try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&limit=400'),j=await r.json(),east=new Set(['PHI','DAL','NYG','WSH','WAS']);nflGames=(j.events||[]).flatMap(ev=>{const c=ev.competitions?.[0];if(!c)return[];const teams=(c.competitors||[]).map(x=>x.team?.abbreviation),d=new Date(ev.date),parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',hour:'numeric',hour12:false}).formatToParts(d),wd=parts.find(x=>x.type==='weekday')?.value,h=Number(parts.find(x=>x.type==='hour')?.value||0),isEast=teams.some(t=>east.has(t)),isPrime=(wd==='Thu'&&h>=19)||(wd==='Sun'&&h>=20)||(wd==='Mon'&&h>=20);if(!isEast&&!isPrime)return[];const name=ev.shortName||ev.name,net=(c.broadcasts||[]).flatMap(b=>b.names||[]).join(', '),tag=isEast?'NFC East':wd==='Thu'?'TNF':wd==='Sun'?'SNF':'MNF';return[{type:'nfl',date:d,title:name,detail:`${tag}${net?' · '+net:''}`}]}).sort((a,b)=>a.date-b.date);renderAll()}catch{$('#games').innerHTML='<div class="empty">NFL schedule could not load right now.</div>'}}
function renderGames(){const now=new Date(),future=nflGames.filter(g=>g.date>now);$('#games').innerHTML=future.length?future.map(g=>`<div class="game"><div><b>${esc(g.title)}</b><div class="small">${esc(g.detail)}</div></div><div class="right">${fmt(g.date)}</div></div>`).join(''):'<div class="empty">Loading NFL schedule…</div>'}
function weights(){const w={};shows.filter(s=>s.status==='Watching'||s.status==='Finished').forEach(s=>(s.genres||[]).forEach(g=>w[g]=(w[g]||0)+1));Object.values(feedback).filter(f=>!f.ignored).forEach(f=>(f.genres||[]).forEach(g=>w[g]=(w[g]||0)+(f.liked?2:-2)));return w}async function loadSuggestions(){const box=$('#suggestions');box.innerHTML='<div class="empty">Loading new suggestions…</div>';try{const w=weights(),owned=new Set(shows.map(s=>s.id)),rated=new Set(Object.keys(feedback).map(Number));let pool=[],tries=0,start=suggestionPage;while(pool.length<150&&tries<16){const r=await fetch(`https://api.tvmaze.com/shows?page=${(start+tries)%240}`);if(r.ok)pool.push(...await r.json());tries++}suggestionPage=(start+tries)%240;localStorage.setItem(PAGEKEY,String(suggestionPage));let c=pool.filter(s=>!owned.has(s.id)&&!rated.has(s.id)&&!shownSuggestions.has(s.id)&&s.image&&(s.genres||[]).length).map(s=>({...s,_score:(s.genres||[]).reduce((n,g)=>n+(w[g]||0),0)+(s.rating?.average||0)/10,_match:(s.genres||[]).filter(g=>(w[g]||0)>0)})).sort((a,b)=>b._score-a._score);if(!c.length){shownSuggestions.clear();localStorage.removeItem(SHOWNKEY);c=pool.filter(s=>!owned.has(s.id)&&!rated.has(s.id)&&s.image&&(s.genres||[]).length)}suggestions=c.slice(0,18);suggestions.forEach(s=>shownSuggestions.add(s.id));localStorage.setItem(SHOWNKEY,JSON.stringify([...shownSuggestions]));renderSuggestions()}catch{box.innerHTML='<div class="empty">Suggestions failed to load.</div>'}}function renderSuggestions(){const box=$('#suggestions');box.innerHTML=suggestions.length?suggestions.map(s=>`<div class="suggestCard">${imageFor(s)?`<img class="poster" src="${esc(imageFor(s))}">`:''}<div class="body"><div class="title">${esc(s.name)}${s.premiered?` <span class="small">(${esc(s.premiered.slice(0,4))})</span>`:''}</div><div class="meta">${esc((s.genres||[]).join(' · '))}${s.rating?.average?` · ${s.rating.average}/10`:''}</div><div class="reason">${s._match?.length?'Matches '+esc(s._match.slice(0,3).join(', ')):'High-rated match'}</div><div class="row"><button class="btn" onclick="addSuggestion(${s.id})">Want to Watch</button><button class="btn notinterested" onclick="dismissSuggestion(${s.id})">Not interested</button></div><div class="row"><button class="btn liked" onclick="rateSuggestion(${s.id},true)">Seen, liked</button><button class="btn disliked" onclick="rateSuggestion(${s.id},false)">Seen, didn’t like</button></div></div></div>`).join(''):'<div class="empty">No new suggestions right now.</div>'}async function addSuggestion(id){const s=suggestions.find(x=>x.id===id);if(s){await addShow(s,'Want to Watch');suggestions=suggestions.filter(x=>x.id!==id);renderSuggestions()}}function rateSuggestion(id,liked){const s=suggestions.find(x=>x.id===id);if(!s)return;feedback[id]={id:s.id,name:s.name,genres:s.genres||[],liked,ignored:false,at:new Date().toISOString()};saveFeedback();suggestions=suggestions.filter(x=>x.id!==id);renderSuggestions()}function dismissSuggestion(id){const s=suggestions.find(x=>x.id===id);if(!s)return;feedback[id]={id:s.id,name:s.name,genres:s.genres||[],liked:null,ignored:true,at:new Date().toISOString()};saveFeedback();suggestions=suggestions.filter(x=>x.id!==id);renderSuggestions()}
let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){$('#results').hidden=true;return}timer=setTimeout(async()=>{try{const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)),data=await r.json();$('#results').innerHTML=data.slice(0,7).map(x=>{const s=x.show,img=s.image?.medium||'';return `<div class="result">${img?`<img src="${esc(img)}">`:''}<div><b>${esc(s.name)}</b><br><small>${esc((s.premiered||'').slice(0,4))} ${esc(s.network?.name||s.webChannel?.name||'')}</small></div></div>`}).join('');[...$('#results').children].forEach((el,i)=>el.onclick=()=>addShow(data[i].show));$('#results').hidden=!data.length}catch{}},300)});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});$('#mainNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#mainNav').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['shows','suggestions','calendar','football'].forEach(p=>$('#'+p+'Page').classList.toggle('hide',p!==b.dataset.page));if(b.dataset.page==='calendar')refreshAll();if(b.dataset.page==='suggestions'&&!suggestions.length)loadSuggestions()});$('#showTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#showTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;renderShows()});$('#prevMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};$('#refreshSuggestions').onclick=loadSuggestions;function renderAll(){renderShows();renderNext();renderCalendar();renderGames()}renderAll();refreshAll();loadNFL();
</script></body></html>
