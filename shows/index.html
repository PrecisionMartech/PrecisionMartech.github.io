<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Shows</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--muted:#8d96a7;--text:#f5f7fb;--line:#2a303b;--accent:#7c9cff;--good:#63d297}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1120px;margin:auto;padding:24px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:30px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}
.search{position:relative;min-width:320px;flex:1;max-width:520px}.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;font-size:16px}
.results{position:absolute;z-index:10;top:50px;left:0;right:0;background:#1a1e26;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.35)}
.result{display:flex;gap:12px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#222733}.result img{width:45px;height:62px;object-fit:cover;border-radius:6px}.result small{color:var(--muted)}
.tabs{display:flex;gap:8px;margin:26px 0 16px;flex-wrap:wrap}.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 13px;cursor:pointer}.tab.active{background:var(--text);color:#101217;border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20242c}.body{padding:14px}.title{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta,.next{font-size:13px;color:var(--muted);margin-top:5px}.next strong{color:var(--good)}
.row{display:flex;gap:8px;margin-top:13px;align-items:center}.row select,.row input{background:#11141a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;min-width:0}.row input{width:58px}.btn{border:1px solid var(--line);background:#232833;color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}.danger{margin-left:auto;color:#ff9b9b}.empty{border:1px dashed var(--line);border-radius:16px;padding:40px;text-align:center;color:var(--muted)}
.stats{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:var(--muted)}.pill b{color:var(--text)}
.credit{margin-top:24px;color:var(--muted);font-size:12px}.credit a{color:var(--muted)}
@media(max-width:620px){.wrap{padding:16px}.search{min-width:100%}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>My Shows</h1><div class="sub">Track what you're watching and where you left off.</div></div>
    <div class="search">
      <input id="search" placeholder="Search for a TV show..." autocomplete="off">
      <div id="results" class="results" hidden></div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab active" data-filter="Watching">Watching</button>
    <button class="tab" data-filter="Want to Watch">Want to Watch</button>
    <button class="tab" data-filter="Finished">Finished</button>
    <button class="tab" data-filter="All">All</button>
  </div>
  <div id="grid" class="grid"></div>
  <div class="credit">TV data provided by <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>.</div>
</div>
<script>
const KEY='my-shows-v1';
let shows=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentFilter='Watching';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(shows));render()}
function imageFor(show){return show.image?.original||show.image?.medium||''}
function fmtDate(s){if(!s)return 'No upcoming episode listed'; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
async function enrich(show){try{const r=await fetch(`https://api.tvmaze.com/shows/${show.id}?embed=nextepisode`);const d=await r.json();const n=d._embedded?.nextepisode;return {...show,next:n?{name:n.name,season:n.season,number:n.number,date:n.airdate}:null}}catch(e){return show}}
async function addShow(raw){if(shows.some(s=>s.id===raw.id)) return; const base={id:raw.id,name:raw.name,image:raw.image,network:raw.network?.name||raw.webChannel?.name||'',status:'Watching',season:1,episode:0,next:null}; shows.unshift(await enrich(base)); save(); $('#results').hidden=true; $('#search').value=''}
function update(id,field,val){const s=shows.find(x=>x.id===id); if(!s)return; s[field]=field==='season'||field==='episode'?Math.max(0,Number(val)||0):val; save()}
function removeShow(id){shows=shows.filter(s=>s.id!==id);save()}
function render(){const visible=currentFilter==='All'?shows:shows.filter(s=>s.status===currentFilter); $('#stats').innerHTML=`<div class="pill"><b>${shows.filter(s=>s.status==='Watching').length}</b> watching</div><div class="pill"><b>${shows.filter(s=>s.status==='Want to Watch').length}</b> queued</div><div class="pill"><b>${shows.filter(s=>s.status==='Finished').length}</b> finished</div>`; if(!visible.length){$('#grid').innerHTML=`<div class="empty">No shows here yet. Search above to add one.</div>`;return} $('#grid').innerHTML=visible.map(s=>`<div class="card">${imageFor(s)?`<img class="poster" src="${esc(imageFor(s))}" alt="">`:`<div class="poster"></div>`}<div class="body"><div class="title" title="${esc(s.name)}">${esc(s.name)}</div><div class="meta">${esc(s.network||'Network not listed')} · ${esc(s.status)}</div><div class="next">${s.next?`Next: <strong>S${s.next.season} E${s.next.number}</strong> ${esc(s.next.name)} · ${fmtDate(s.next.date)}`:'No upcoming episode listed'}</div><div class="row"><span>S</span><input type="number" min="0" value="${s.season}" onchange="update(${s.id},'season',this.value)"><span>E</span><input type="number" min="0" value="${s.episode}" onchange="update(${s.id},'episode',this.value)"></div><div class="row"><select onchange="update(${s.id},'status',this.value)">${['Watching','Want to Watch','Finished'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="refreshOne(${s.id})">Refresh</button><button class="btn danger" onclick="removeShow(${s.id})">Remove</button></div></div></div>`).join('')}
async function refreshOne(id){const i=shows.findIndex(s=>s.id===id); if(i<0)return; shows[i]=await enrich(shows[i]);save()}
let timer;
$('#search').addEventListener('input',e=>{clearTimeout(timer); const q=e.target.value.trim(); if(q.length<2){$('#results').hidden=true;return} timer=setTimeout(async()=>{try{const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)); if(!r.ok) throw new Error('Search failed'); const data=await r.json(); $('#results').innerHTML=data.slice(0,7).map(x=>{const s=x.show; const img=s.image?.medium||''; return `<div class="result">${img?`<img src="${esc(img)}" alt="">`:`<div style="width:45px"></div>`}<div><b>${esc(s.name)}</b><br><small>${esc((s.premiered||'').slice(0,4))} ${esc(s.network?.name||s.webChannel?.name||'')}</small></div></div>`}).join(''); [...$('#results').children].forEach((el,i)=>el.onclick=()=>addShow(data[i].show)); $('#results').hidden=!data.length}catch(e){$('#results').innerHTML='<div class="result"><div>Search failed. Try again.</div></div>'; $('#results').hidden=false}},300)});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});
render();
</script>
</body>
</html>
