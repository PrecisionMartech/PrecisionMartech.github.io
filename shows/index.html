<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>My Shows & Games</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--muted:#8d96a7;--text:#f5f7fb;--line:#2a303b;--good:#63d297;--tv:#7c9cff;--nfl:#58c48d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:1120px;margin:auto;padding:20px}.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:14px;margin-top:5px}
.search{position:relative;min-width:300px;flex:1;max-width:500px}.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 14px;font-size:16px}.results{position:absolute;z-index:20;top:50px;left:0;right:0;background:#1a1e26;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 12px 35px rgba(0,0,0,.35)}.result{display:flex;gap:12px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result:hover{background:#222733}.result img{width:45px;height:62px;object-fit:cover;border-radius:6px}.result small{color:var(--muted)}
.nav{display:flex;gap:8px;margin:22px 0 16px;flex-wrap:wrap}.nav button,.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}.nav button.active,.tab.active{background:var(--text);color:#101217;border-color:var(--text)}
.nextgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.nextcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.big{font-size:20px;font-weight:750;margin-top:6px}.small{font-size:13px;color:var(--muted);margin-top:5px}.tag{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;margin-top:8px}.tvtag{background:rgba(124,156,255,.15);color:#aabaff}.nfltag{background:rgba(88,196,141,.15);color:#8fe0b5}
.stats{display:flex;gap:10px;margin:12px 0 18px;flex-wrap:wrap}.pill{background:var(--card);border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:var(--muted)}.pill b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20242c}.body{padding:14px}.title{font-size:18px;font-weight:700}.meta,.next{font-size:13px;color:var(--muted);margin-top:5px}.next strong{color:var(--good)}.row{display:flex;gap:8px;margin-top:13px;align-items:center}.row select,.row input{background:#11141a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;min-width:0}.row input{width:58px}.btn{border:1px solid var(--line);background:#232833;color:var(--text);border-radius:8px;padding:8px 10px;cursor:pointer}.danger{margin-left:auto;color:#ff9b9b}.empty{border:1px dashed var(--line);border-radius:16px;padding:35px;text-align:center;color:var(--muted)}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:8px 0 12px}.calhead h2{font-size:20px;margin:0}.calhead button{background:#232833;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:5px}.day{min-height:100px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px;overflow:hidden}.day.muted{opacity:.4}.date{font-size:12px;color:var(--muted);margin-bottom:5px}.event{font-size:11px;padding:5px 6px;border-radius:6px;margin-top:4px;line-height:1.25}.event.tv{background:rgba(124,156,255,.14);border-left:3px solid var(--tv)}.event.nfl{background:rgba(88,196,141,.14);border-left:3px solid var(--nfl)}
.games{display:grid;gap:10px}.game{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:space-between;gap:12px}.game b{display:block}.game .right{text-align:right;color:var(--muted);font-size:13px}.credit{margin-top:24px;color:var(--muted);font-size:12px}.credit a{color:var(--muted)}
.hide{display:none}@media(max-width:680px){.wrap{padding:14px}.search{min-width:100%}.nextgrid{grid-template-columns:1fr}.day{min-height:78px;padding:4px}.event{font-size:9px;padding:3px}.weekday{font-size:9px}.game{display:block}.game .right{text-align:left;margin-top:6px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>My Shows & Games</h1><div class="sub">TV progress, upcoming episodes, and Eagles football in one place.</div></div><div class="search"><input id="search" placeholder="Search for a TV show..." autocomplete="off"><div id="results" class="results" hidden></div></div></div>
  <div id="nextgrid" class="nextgrid"></div>
  <div class="nav"><button class="active" data-page="shows">Shows</button><button data-page="calendar">Calendar</button><button data-page="football">Eagles</button></div>

  <section id="showsPage">
    <div class="stats" id="stats"></div>
    <div class="nav" style="margin-top:0"><button class="tab active" data-filter="Watching">Watching</button><button class="tab" data-filter="Want to Watch">Want to Watch</button><button class="tab" data-filter="Finished">Finished</button><button class="tab" data-filter="All">All</button></div>
    <div id="grid" class="grid"></div>
  </section>

  <section id="calendarPage" class="hide">
    <div class="calhead"><button id="prevMonth">‹</button><h2 id="monthTitle"></h2><button id="nextMonth">›</button></div>
    <div class="week"><div class="weekday">SUN</div><div class="weekday">MON</div><div class="weekday">TUE</div><div class="weekday">WED</div><div class="weekday">THU</div><div class="weekday">FRI</div><div class="weekday">SAT</div></div>
    <div id="calendar" class="calendar"></div>
  </section>

  <section id="footballPage" class="hide"><div id="games" class="games"></div></section>
  <div class="credit">TV data: <a href="https://www.tvmaze.com" target="_blank" rel="noopener">TVmaze</a>. Eagles schedule is refreshed from a sports feed with a built-in 2026 schedule fallback.</div>
</div>
<script>
const KEY='my-shows-v1';let shows=JSON.parse(localStorage.getItem(KEY)||'[]');let currentFilter='Watching';let calDate=new Date();let games=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fallbackGames=[
['2026-08-28T20:00:00-04:00','Cincinnati Bengals','Preseason Week 3','CBS'],['2026-09-13T16:25:00-04:00','Washington Commanders','Week 1','FOX'],['2026-09-20T13:00:00-04:00','at Tennessee Titans','Week 2','FOX'],['2026-09-28T20:15:00-04:00','at Chicago Bears','Week 3','ESPN'],['2026-10-04T13:00:00-04:00','Los Angeles Rams','Week 4','FOX'],['2026-10-11T09:30:00-04:00','at Jacksonville Jaguars (London)','Week 5','NFL Network'],['2026-10-18T13:00:00-04:00','Carolina Panthers','Week 6','CBS'],['2026-10-26T20:15:00-04:00','Dallas Cowboys','Week 7','ESPN'],['2026-11-01T20:20:00-05:00','at Washington Commanders','Week 8','NBC'],['2026-11-08T13:00:00-05:00','New York Giants','Week 9','FOX'],['2026-11-22T16:25:00-05:00','Pittsburgh Steelers','Week 11','CBS'],['2026-11-26T16:30:00-05:00','at Dallas Cowboys','Week 12','FOX'],['2026-12-06T16:05:00-05:00','at Arizona Cardinals','Week 13','FOX'],['2026-12-13T13:00:00-05:00','Indianapolis Colts','Week 14','FOX'],['2026-12-19T17:00:00-05:00','Seattle Seahawks','Week 15','FOX'],['2026-12-24T20:15:00-05:00','Houston Texans','Week 16','Prime Video'],['2027-01-03T20:20:00-05:00','at San Francisco 49ers','Week 17','NBC']].map((g,i)=>({id:'fb'+i,date:g[0],opponent:g[1],week:g[2],network:g[3]}));
function save(){localStorage.setItem(KEY,JSON.stringify(shows));renderShows();renderNext();renderCalendar()}
function imageFor(s){return s.image?.original||s.image?.medium||''}function fmtDateTime(v){return new Date(v).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}
async function enrich(show){try{const r=await fetch(`https://api.tvmaze.com/shows/${show.id}?embed=nextepisode`);const d=await r.json();const n=d._embedded?.nextepisode;return {...show,next:n?{name:n.name,season:n.season,number:n.number,date:n.airdate,airtime:n.airtime||''}:null}}catch(e){return show}}
async function refreshShows(){for(let i=0;i<shows.length;i++)shows[i]=await enrich(shows[i]);save()}
async function addShow(raw){if(shows.some(s=>s.id===raw.id))return;const base={id:raw.id,name:raw.name,image:raw.image,network:raw.network?.name||raw.webChannel?.name||'',status:'Watching',season:1,episode:0,next:null};shows.unshift(await enrich(base));save();$('#results').hidden=true;$('#search').value=''}
function update(id,field,val){const s=shows.find(x=>x.id===id);if(!s)return;s[field]=field==='season'||field==='episode'?Math.max(0,Number(val)||0):val;save()}function removeShow(id){shows=shows.filter(s=>s.id!==id);save()}
function renderShows(){const visible=currentFilter==='All'?shows:shows.filter(s=>s.status===currentFilter);$('#stats').innerHTML=`<div class="pill"><b>${shows.filter(s=>s.status==='Watching').length}</b> watching</div><div class="pill"><b>${shows.filter(s=>s.status==='Want to Watch').length}</b> queued</div><div class="pill"><b>${shows.filter(s=>s.status==='Finished').length}</b> finished</div>`;if(!visible.length){$('#grid').innerHTML='<div class="empty">No shows here yet. Search above to add one.</div>';return}$('#grid').innerHTML=visible.map(s=>`<div class="card">${imageFor(s)?`<img class="poster" src="${esc(imageFor(s))}" alt="">`:'<div class="poster"></div>'}<div class="body"><div class="title">${esc(s.name)}</div><div class="meta">${esc(s.network||'Network not listed')} · ${esc(s.status)}</div><div class="next">${s.next?`Next: <strong>S${s.next.season} E${s.next.number}</strong> ${esc(s.next.name)} · ${esc(s.next.date)} ${esc(s.next.airtime)}`:'No upcoming episode listed'}</div><div class="row"><span>S</span><input type="number" min="0" value="${s.season}" onchange="update(${s.id},'season',this.value)"><span>E</span><input type="number" min="0" value="${s.episode}" onchange="update(${s.id},'episode',this.value)"></div><div class="row"><select onchange="update(${s.id},'status',this.value)">${['Watching','Want to Watch','Finished'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="refreshOne(${s.id})">Refresh</button><button class="btn danger" onclick="removeShow(${s.id})">Remove</button></div></div></div>`).join('')}
async function refreshOne(id){const i=shows.findIndex(s=>s.id===id);if(i<0)return;shows[i]=await enrich(shows[i]);save()}
async function loadGames(){games=fallbackGames;try{const r=await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/phi/schedule');if(!r.ok)throw 0;const d=await r.json();const parsed=(d.events||[]).map(e=>{const comp=e.competitions?.[0];const teams=comp?.competitors||[];const opp=teams.find(t=>t.team?.abbreviation!=='PHI');const isAway=teams.find(t=>t.team?.abbreviation==='PHI')?.homeAway==='away';return{id:e.id,date:e.date,opponent:(isAway?'at ':'')+(opp?.team?.displayName||'Opponent'),week:e.week?.text||e.season?.type===1?'Preseason':'',network:comp?.broadcasts?.[0]?.names?.[0]||''}}).filter(x=>x.date);if(parsed.length)games=parsed}catch(e){}renderGames();renderNext();renderCalendar()}
function renderGames(){const future=games.filter(g=>new Date(g.date)>new Date()).sort((a,b)=>new Date(a.date)-new Date(b.date));$('#games').innerHTML=future.length?future.map(g=>`<div class="game"><div><b>Eagles ${esc(g.opponent)}</b><div class="small">${esc(g.week||'Game')}</div></div><div class="right">${fmtDateTime(g.date)}<br>${esc(g.network||'')}</div></div>`).join(''):'<div class="empty">No upcoming Eagles games found.</div>'}
function tvEvents(){return shows.filter(s=>s.status==='Watching'&&s.next?.date).map(s=>{const t=s.next.airtime||'20:00';return{type:'tv',date:new Date(`${s.next.date}T${t}:00`),title:`${s.name} S${s.next.season}E${s.next.number}`}})}function footballEvents(){return games.map(g=>({type:'nfl',date:new Date(g.date),title:`Eagles ${g.opponent}`}))}
function renderNext(){const now=new Date();const tv=tvEvents().filter(e=>e.date>now).sort((a,b)=>a.date-b.date)[0];const game=footballEvents().filter(e=>e.date>now).sort((a,b)=>a.date-b.date)[0];$('#nextgrid').innerHTML=`<div class="nextcard"><div class="label">Next episode</div><div class="big">${tv?esc(tv.title):'Nothing scheduled'}</div><div class="small">${tv?fmtDateTime(tv.date):'Add or refresh a show to see its next episode.'}</div><span class="tag tvtag">TV</span></div><div class="nextcard"><div class="label">Next Eagles game</div><div class="big">${game?esc(game.title):'Nothing scheduled'}</div><div class="small">${game?fmtDateTime(game.date):'No upcoming game found.'}</div><span class="tag nfltag">Eagles</span></div>`}
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();$('#monthTitle').textContent=calDate.toLocaleString(undefined,{month:'long',year:'numeric'});const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());const events=[...tvEvents(),...footballEvents()];let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const same=d.getMonth()===m;const todays=events.filter(e=>e.date.getFullYear()===d.getFullYear()&&e.date.getMonth()===d.getMonth()&&e.date.getDate()===d.getDate());html+=`<div class="day ${same?'':'muted'}"><div class="date">${d.getDate()}</div>${todays.map(e=>`<div class="event ${e.type}">${esc(e.title)}<br>${e.date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</div>`).join('')}</div>`}$('#calendar').innerHTML=html}
let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){$('#results').hidden=true;return}timer=setTimeout(async()=>{try{const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q));if(!r.ok)throw 0;const data=await r.json();$('#results').innerHTML=data.slice(0,7).map(x=>{const s=x.show,img=s.image?.medium||'';return`<div class="result">${img?`<img src="${esc(img)}" alt="">`:'<div style="width:45px"></div>'}<div><b>${esc(s.name)}</b><br><small>${esc((s.premiered||'').slice(0,4))} ${esc(s.network?.name||s.webChannel?.name||'')}</small></div></div>`}).join('');[...$('#results').children].forEach((el,i)=>el.onclick=()=>addShow(data[i].show));$('#results').hidden=!data.length}catch(e){$('#results').innerHTML='<div class="result"><div>Search failed. Try again.</div></div>';$('#results').hidden=false}},300)});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;renderShows()});document.querySelectorAll('.nav>button[data-page]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav>button[data-page]').forEach(x=>x.classList.remove('active'));b.classList.add('active');['shows','calendar','football'].forEach(p=>$('#'+p+'Page').classList.toggle('hide',p!==b.dataset.page))});$('#prevMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};
renderShows();renderNext();renderCalendar();loadGames();refreshShows();
</script>
</body>
</html>
