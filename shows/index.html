<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Shows & Games</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--muted:#8d96a7;--text:#f5f7fb;--line:#2a303b;--tv:#7c9cff;--nfl:#58c48d;--good:#63d297;--bad:#ff9b9b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:28px}.sub,.small,.meta,.sync{color:var(--muted);font-size:13px}.search{position:relative;flex:1;max-width:480px;min-width:280px}.search input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px;border-radius:12px;font-size:16px}.results{position:absolute;z-index:20;top:50px;left:0;right:0;background:#1b1f27;border:1px solid var(--line);border-radius:12px;overflow:hidden}.result{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}.result img{width:44px;height:62px;object-fit:cover;border-radius:6px}.nextgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.nextcard,.card,.game,.agendaItem,.suggestCard{background:var(--card);border:1px solid var(--line);border-radius:14px}.nextcard{padding:14px}.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.big{font-size:20px;font-weight:700;margin-top:5px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.nav button,.btn{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}.nav button.active{background:var(--text);color:#111;border-color:var(--text)}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 11px;color:var(--muted)}.pill b{color:var(--text)}.grid,.suggestGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.card,.suggestCard{overflow:hidden}.poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:#20242c}.body{padding:13px}.title{font-size:18px;font-weight:700}.next{font-size:13px;color:var(--muted);margin-top:5px}.next strong{color:var(--good)}.row{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}.row input,.row select{background:#11141a;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px}.row input{width:58px}.btn{background:#232833;color:var(--text);border-radius:8px;padding:8px 10px}.danger{margin-left:auto;color:var(--bad)}.liked{color:var(--good)}.disliked{color:var(--bad)}.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}.calhead h2{font-size:20px;margin:0}.calhead button{background:#232833;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekday{text-align:center;color:var(--muted);font-size:11px}.day{min-height:108px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px}.date{font-size:12px;color:var(--muted)}.event{font-size:11px;padding:5px 6px;border-radius:6px;margin-top:5px}.event.tv{background:rgba(124,156,255,.15);border-left:3px solid var(--tv)}.event.nfl{background:rgba(88,196,141,.15);border-left:3px solid var(--nfl)}.agenda{display:none}.agendaItem{padding:13px;margin-bottom:9px;display:flex;gap:12px}.agendaDate{width:58px;flex:0 0 58px;text-align:center}.agendaDate b{display:block;font-size:22px}.agendaDate span{font-size:11px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.tv{background:var(--tv)}.dot.nfl{background:var(--nfl)}.games{display:grid;gap:9px}.game{padding:13px;display:flex;justify-content:space-between;gap:12px}.right{text-align:right;color:var(--muted);font-size:13px}.empty{border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}.hide{display:none}.reason{font-size:12px;color:#aeb8ff;margin-top:7px}.suggestHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.suggestHead h2{margin:0;font-size:20px}
@media(max-width:700px){.wrap{padding:14px}.search{min-width:100%}.nextgrid{grid-template-columns:1fr}.week,.calendar{display:none}.agenda{display:block}.calhead{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}.game{display:block}.right{text-align:left;margin-top:5px}.row .btn{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div><h1>My Shows & Games</h1><div class="sub">TV progress, recommendations, upcoming episodes, and Eagles football.</div></div><div class="search"><input id="search" placeholder="Search for a TV show..." autocomplete="off"><div id="results" class="results" hidden></div></div></div>
<div id="nextgrid" class="nextgrid"></div>
<div class="nav" id="mainNav"><button class="active" data-page="shows">Shows</button><button data-page="suggestions">Suggestions</button><button data-page="calendar">Calendar</button><button data-page="football">Eagles</button></div>
<section id="showsPage"><div id="stats" class="stats"></div><div class="nav" id="showTabs"><button class="active" data-filter="Watching">Watching</button><button data-filter="Want to Watch">Want to Watch</button><button data-filter="Finished">Finished</button><button data-filter="All">All</button></div><div id="grid" class="grid"></div></section>
<section id="suggestionsPage" class="hide"><div class="suggestHead"><div><h2>Suggestions for You</h2><div class="small" id="suggestBasis">Based on shows you liked, disliked, Watching, and Finished.</div></div><button class="btn" id="refreshSuggestions">Refresh</button></div><div id="suggestions" class="suggestGrid"></div></section>
<section id="calendarPage" class="hide"><div class="calhead"><button id="prevMonth">‹</button><h2 id="monthTitle"></h2><button id="nextMonth">›</button></div><div id="syncStatus" class="sync"></div><div class="week"><div class="weekday">SUN</div><div class="weekday">MON</div><div class="weekday">TUE</div><div class="weekday">WED</div><div class="weekday">THU</div><div class="weekday">FRI</div><div class="weekday">SAT</div></div><div id="calendar" class="calendar"></div><div id="agenda" class="agenda"></div></section>
<section id="footballPage" class="hide"><div id="games" class="games"></div></section>
</div>
<script>
const KEY='my-shows-v2',OLDKEY='my-shows-v1',FBKEY='my-shows-feedback-v1';let shows=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem(OLDKEY)||'[]');let feedback=JSON.parse(localStorage.getItem(FBKEY)||'{}');let currentFilter='Watching',calDate=new Date(),suggestions=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const games=[['2026-08-28T20:00:00-04:00','Cincinnati Bengals','vs','Preseason Week 3','CBS'],['2026-09-13T16:25:00-04:00','Washington Commanders','vs','Week 1','FOX'],['2026-09-20T13:00:00-04:00','Tennessee Titans','at','Week 2','FOX'],['2026-09-28T20:15:00-04:00','Chicago Bears','at','Week 3','ESPN'],['2026-10-04T13:00:00-04:00','Los Angeles Rams','vs','Week 4','FOX'],['2026-10-11T09:30:00-04:00','Jacksonville Jaguars','at','Week 5, London','NFL Network'],['2026-10-18T13:00:00-04:00','Carolina Panthers','vs','Week 6','CBS'],['2026-10-26T20:15:00-04:00','Dallas Cowboys','vs','Week 7','ESPN'],['2026-11-01T20:20:00-05:00','Washington Commanders','at','Week 8','NBC'],['2026-11-08T13:00:00-05:00','New York Giants','vs','Week 9','FOX'],['2026-11-22T16:25:00-05:00','Pittsburgh Steelers','vs','Week 11','CBS'],['2026-11-26T16:30:00-05:00','Dallas Cowboys','at','Week 12','FOX'],['2026-12-06T16:05:00-05:00','Arizona Cardinals','at','Week 13','FOX'],['2026-12-13T13:00:00-05:00','Indianapolis Colts','vs','Week 14','FOX'],['2026-12-19T17:00:00-05:00','Seattle Seahawks','vs','Week 15','FOX'],['2026-12-24T20:15:00-05:00','Houston Texans','vs','Week 16','Prime Video'],['2027-01-03T20:20:00-05:00','San Francisco 49ers','at','Week 17','NBC']].map(g=>({date:g[0],opponent:g[1],where:g[2],week:g[3],network:g[4]}));
function save(){localStorage.setItem(KEY,JSON.stringify(shows));renderAll()}function saveFeedback(){localStorage.setItem(FBKEY,JSON.stringify(feedback))}function imageFor(s){return s.image?.original||s.image?.medium||''}function fmt(v){return new Date(v).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}function episodeDate(e){if(!e.airdate)return null;const t=(e.airtime&&/^\d\d:\d\d$/.test(e.airtime))?e.airtime:'20:00';return new Date(`${e.airdate}T${t}:00`)}
async function enrich(show){try{const [sr,er]=await Promise.all([fetch(`https://api.tvmaze.com/shows/${show.id}?embed=nextepisode`),fetch(`https://api.tvmaze.com/shows/${show.id}/episodes?specials=1`)]);const sd=await sr.json(),eps=await er.json(),now=new Date(),future=(Array.isArray(eps)?eps:[]).filter(e=>{const d=episodeDate(e);return d&&d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())}).map(e=>({id:e.id,name:e.name,season:e.season,number:e.number,date:e.airdate,airtime:e.airtime||'20:00'})).sort((a,b)=>episodeDate(a)-episodeDate(b)),n=future[0]||sd._embedded?.nextepisode;return {...show,genres:sd.genres||show.genres||[],rating:sd.rating?.average||show.rating||null,next:n?{name:n.name,season:n.season,number:n.number,date:n.date||n.airdate,airtime:n.airtime||'20:00'}:null,futureEpisodes:future,lastSynced:new Date().toISOString()}}catch(e){return {...show,futureEpisodes:show.futureEpisodes||[],genres:show.genres||[]}}}
async function addShow(raw,status='Watching'){if(shows.some(s=>s.id===raw.id))return;const base={id:raw.id,name:raw.name,image:raw.image,network:raw.network?.name||raw.webChannel?.name||'',genres:raw.genres||[],rating:raw.rating?.average||null,status,season:1,episode:0,next:null,futureEpisodes:[]};shows.unshift(await enrich(base));save();$('#results').hidden=true;$('#search').value=''}
function updateShow(id,f,v){const s=shows.find(x=>x.id===id);if(!s)return;s[f]=(f==='season'||f==='episode')?Math.max(0,Number(v)||0):v;save()}function removeShow(id){shows=shows.filter(s=>s.id!==id);save()}async function refreshOne(id){const i=shows.findIndex(s=>s.id===id);if(i<0)return;shows[i]=await enrich(shows[i]);save()}async function refreshAll(){const list=shows.map((s,i)=>({s,i})).filter(x=>x.s.status==='Watching'||x.s.status==='Finished');if(!list.length)return;if($('#syncStatus'))$('#syncStatus').textContent='Updating episode dates…';for(const x of list)shows[x.i]=await enrich(shows[x.i]);localStorage.setItem(KEY,JSON.stringify(shows));if($('#syncStatus'))$('#syncStatus').textContent='Episode dates updated.';renderAll()}
function renderShows(){const visible=currentFilter==='All'?shows:shows.filter(s=>s.status===currentFilter);$('#stats').innerHTML=`<div class="pill"><b>${shows.filter(s=>s.status==='Watching').length}</b> watching</div><div class="pill"><b>${shows.filter(s=>s.status==='Want to Watch').length}</b> queued</div><div class="pill"><b>${shows.filter(s=>s.status==='Finished').length}</b> finished</div>`;if(!visible.length){$('#grid').innerHTML='<div class="empty">No shows here yet. Search above to add one.</div>';return}$('#grid').innerHTML=visible.map(s=>`<div class="card">${imageFor(s)?`<img class="poster" src="${esc(imageFor(s))}" alt="">`:'<div class="poster"></div>'}<div class="body"><div class="title">${esc(s.name)}</div><div class="meta">${esc(s.network||'Network not listed')} · ${esc(s.status)}</div><div class="next">${s.next?`Next: <strong>S${s.next.season} E${s.next.number}</strong> ${esc(s.next.name)} · ${esc(s.next.date)} ${esc(s.next.airtime)}`:'No upcoming episode listed'}</div><div class="meta">${(s.futureEpisodes||[]).length} announced future episode${(s.futureEpisodes||[]).length===1?'':'s'}</div><div class="row"><span>S</span><input type="number" min="0" value="${s.season}" onchange="updateShow(${s.id},'season',this.value)"><span>E</span><input type="number" min="0" value="${s.episode}" onchange="updateShow(${s.id},'episode',this.value)"></div><div class="row"><select onchange="updateShow(${s.id},'status',this.value)">${['Watching','Want to Watch','Finished'].map(v=>`<option ${v===s.status?'selected':''}>${v}</option>`).join('')}</select><button class="btn" onclick="refreshOne(${s.id})">Refresh</button><button class="btn danger" onclick="removeShow(${s.id})">Remove</button></div></div></div>`).join('')}
function allEvents(){const tv=[];shows.filter(s=>s.status==='Watching').forEach(s=>(s.futureEpisodes||[]).forEach(e=>{const d=episodeDate(e);if(d)tv.push({type:'tv',date:d,title:`${s.name} S${e.season}E${e.number}`,detail:e.name||''})}));const nfl=games.map(g=>({type:'nfl',date:new Date(g.date),title:`Eagles ${g.where} ${g.opponent}`,detail:`${g.week} · ${g.network}`}));return [...tv,...nfl].sort((a,b)=>a.date-b.date)}
function renderNext(){const ev=allEvents().filter(e=>e.date>new Date()),tv=ev.find(e=>e.type==='tv'),nfl=ev.find(e=>e.type==='nfl');$('#nextgrid').innerHTML=`<div class="nextcard"><div class="label">Next Episode</div><div class="big">${tv?esc(tv.title):'Nothing scheduled'}</div><div class="small">${tv?fmt(tv.date):'No announced episode date.'}</div></div><div class="nextcard"><div class="label">Next Eagles Game</div><div class="big">${nfl?esc(nfl.title):'No game scheduled'}</div><div class="small">${nfl?fmt(nfl.date):''}</div></div>`}
function renderCalendar(){const y=calDate.getFullYear(),m=calDate.getMonth();$('#monthTitle').textContent=calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});const ev=allEvents().filter(e=>e.date.getFullYear()===y&&e.date.getMonth()===m),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let html='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const dayEv=ev.filter(e=>e.date.toDateString()===d.toDateString());html+=`<div class="day" style="${d.getMonth()!==m?'opacity:.35':''}"><div class="date">${d.getDate()}</div>${dayEv.map(e=>`<div class="event ${e.type}">${esc(e.title)}</div>`).join('')}</div>`}$('#calendar').innerHTML=html;const days=[...new Set(ev.map(e=>e.date.toDateString()))].map(s=>new Date(s)).sort((a,b)=>a-b);$('#agenda').innerHTML=days.length?days.map(d=>{const dayEv=ev.filter(e=>e.date.toDateString()===d.toDateString());return `<div class="agendaItem"><div class="agendaDate"><span>${d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase()}</span><b>${d.getDate()}</b><span>${d.toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</span></div><div>${dayEv.map(e=>`<div style="margin-bottom:10px"><b><span class="dot ${e.type}"></span>${esc(e.title)}</b><div class="small">${esc(e.detail)} · ${e.date.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})}</div></div>`).join('')}</div></div>`}).join(''):'<div class="empty">Nothing announced for this month yet.</div>'}
function renderGames(){const future=games.filter(g=>new Date(g.date)>new Date());$('#games').innerHTML=future.map(g=>`<div class="game"><div><b>Eagles ${g.where} ${esc(g.opponent)}</b><div class="small">${esc(g.week)}</div></div><div class="right">${fmt(g.date)}<br>${esc(g.network)}</div></div>`).join('')}
function weights(){const w={};shows.filter(s=>s.status==='Watching'||s.status==='Finished').forEach(s=>(s.genres||[]).forEach(g=>w[g]=(w[g]||0)+1));Object.values(feedback).forEach(f=>(f.genres||[]).forEach(g=>w[g]=(w[g]||0)+(f.liked?2:-2)));return w}
async function loadSuggestions(){const box=$('#suggestions');box.innerHTML='<div class="empty">Loading suggestions…</div>';try{const w=weights(),owned=new Set(shows.map(s=>s.id)),seen=new Set(Object.keys(feedback).map(Number));let pool=[];for(let p=0;p<8;p++){const r=await fetch(`https://api.tvmaze.com/shows?page=${p}`);if(r.ok)pool.push(...await r.json())}suggestions=pool.filter(s=>!owned.has(s.id)&&!seen.has(s.id)&&s.image&&(s.genres||[]).length).map(s=>{const overlap=(s.genres||[]).reduce((n,g)=>n+(w[g]||0),0),score=overlap+(s.rating?.average||0)/10;return {...s,_score:score,_match:(s.genres||[]).filter(g=>(w[g]||0)>0)}}).sort((a,b)=>b._score-a._score).slice(0,18);renderSuggestions()}catch(e){box.innerHTML='<div class="empty">Suggestions failed to load. Try Refresh.</div>'}}
function renderSuggestions(){const box=$('#suggestions');if(!suggestions.length){box.innerHTML='<div class="empty">No new suggestions right now.</div>';return}box.innerHTML=suggestions.map(s=>`<div class="suggestCard">${imageFor(s)?`<img class="poster" src="${esc(imageFor(s))}" alt="">`:''}<div class="body"><div class="title">${esc(s.name)}</div><div class="meta">${esc((s.genres||[]).join(' · '))}${s.rating?.average?` · ${s.rating.average}/10`:''}</div><div class="reason">${s._match.length?'Matches '+esc(s._match.slice(0,3).join(', ')):'High-rated match'}</div><div class="row"><button class="btn" onclick="addSuggestion(${s.id})">Want to Watch</button></div><div class="row"><button class="btn liked" onclick="rateSuggestion(${s.id},true)">Seen, liked</button><button class="btn disliked" onclick="rateSuggestion(${s.id},false)">Seen, didn’t like</button></div></div></div>`).join('')}
async function addSuggestion(id){const s=suggestions.find(x=>x.id===id);if(!s)return;await addShow(s,'Want to Watch');suggestions=suggestions.filter(x=>x.id!==id);renderSuggestions()}
function rateSuggestion(id,liked){const s=suggestions.find(x=>x.id===id);if(!s)return;feedback[id]={id:s.id,name:s.name,genres:s.genres||[],liked,at:new Date().toISOString()};saveFeedback();suggestions=suggestions.filter(x=>x.id!==id);renderSuggestions();setTimeout(loadSuggestions,50)}
let timer;$('#search').addEventListener('input',e=>{clearTimeout(timer);const q=e.target.value.trim();if(q.length<2){$('#results').hidden=true;return}timer=setTimeout(async()=>{try{const r=await fetch('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q)),data=await r.json();$('#results').innerHTML=data.slice(0,7).map(x=>{const s=x.show,img=s.image?.medium||'';return `<div class="result">${img?`<img src="${esc(img)}" alt="">`:''}<div><b>${esc(s.name)}</b><br><small>${esc((s.premiered||'').slice(0,4))} ${esc(s.network?.name||s.webChannel?.name||'')}</small></div></div>`}).join('');[...$('#results').children].forEach((el,i)=>el.onclick=()=>addShow(data[i].show));$('#results').hidden=!data.length}catch(e){$('#results').hidden=false;$('#results').innerHTML='<div class="result">Search failed. Try again.</div>'}},300)});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('#results').hidden=true});
$('#mainNav').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#mainNav').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['shows','suggestions','calendar','football'].forEach(p=>$('#'+p+'Page').classList.toggle('hide',p!==b.dataset.page));if(b.dataset.page==='calendar')refreshAll();if(b.dataset.page==='suggestions'&&!suggestions.length)loadSuggestions()});$('#showTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#showTabs').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;renderShows()});$('#prevMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);renderCalendar()};$('#nextMonth').onclick=()=>{calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);renderCalendar()};$('#refreshSuggestions').onclick=loadSuggestions;function renderAll(){renderShows();renderNext();renderCalendar();renderGames()}renderAll();refreshAll();
</script>
</body>
</html>
